; Elecrow CrowPanel 7.0" and 5.0" HMI ESP32 displays (ESP32-S3-WROOM-1-N4R8,
; 800x480 RGB parallel panel, GT911 capacitive touch)

[platformio]
default_envs = crowpanel7

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; -O2 rather than Arduino's -Os: LVGL draws about 15% faster
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/../ui
    -I${PROJECT_DIR}/include

lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@7.2.1
    symlink://../ui

[env:crowpanel7]

[env:crowpanel5]
build_flags =
    ${env.build_flags}
    -DBOARD_CROWPANEL5
